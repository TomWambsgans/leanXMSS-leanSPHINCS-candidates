name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/xmss/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Serve the pages at / and /xmss/, and redirect /sphincs/ to the root
        run: |
          mkdir -p _site/sphincs _site/xmss
          cp site/index.html _site/index.html
          cp site/xmss/index.html _site/xmss/index.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><link rel="canonical" href="../"><title>leanSPHINCS</title><a href="../">leanSPHINCS</a>\n' > _site/sphincs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
