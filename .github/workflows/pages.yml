name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/sphinx.png'
      - 'site/data.json'
      - 'site/v1/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Serve this page at /, the old page at /v1/, and redirect /v2-beta/ and /sphincs/ to the root
        run: |
          mkdir -p _site/v1 _site/v2-beta _site/sphincs
          cp site/index.html site/sphinx.png site/data.json _site/
          cp site/v1/index.html site/v1/sphinx.png _site/v1/
          for d in v2-beta sphincs; do
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><link rel="canonical" href="../"><title>leanSPHINCS</title><a href="../">leanSPHINCS</a>\n' > _site/$d/index.html
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
