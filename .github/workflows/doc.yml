name: Note PDF

on:
  push:
    branches: [ "main" ]
    paths:
      - 'leansphincs.tex'
      - 'latexmkrc'
      - '.github/workflows/doc.yml'
  pull_request:
    paths:
      - 'leansphincs.tex'
      - 'latexmkrc'
      - '.github/workflows/doc.yml'
  workflow_dispatch:

concurrency:
  group: doc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pdf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: leansphincs.tex
      - name: Fail on an undefined reference or citation
        run: |
          ! grep -qE 'Reference .* undefined|Citation .* undefined|multiply defined' .build/leansphincs.log

  build-pdf:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: leansphincs.tex
      - name: Fail on an undefined reference or citation
        run: |
          ! grep -qE 'Reference .* undefined|Citation .* undefined|multiply defined' .build/leansphincs.log
      - name: Name the artifact
        run: cp .build/leansphincs.pdf leansphincs.pdf
      - name: Publish the PDF as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: doc-latest
          name: leanSphincs candidate note
          body: |
            Auto-built on every push to `main`.

            `leansphincs.pdf` is the note describing the leanSphincs candidate.
          make_latest: false
          files: leansphincs.pdf
