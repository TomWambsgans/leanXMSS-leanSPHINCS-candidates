name: Note PDFs

on:
  push:
    branches: [ "main" ]
    paths:
      - 'leanSPHINCS.tex'
      - 'slides.tex'
      - 'site/sphinx.png'
      - 'latexmkrc'
      - '.github/workflows/doc.yml'
  pull_request:
    paths:
      - 'leanSPHINCS.tex'
      - 'slides.tex'
      - 'site/sphinx.png'
      - 'latexmkrc'
      - '.github/workflows/doc.yml'
  workflow_dispatch:

concurrency:
  group: doc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pdf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            leanSPHINCS.tex
            slides.tex
      - name: Fail on an undefined reference or citation
        run: |
          ! grep -qE 'Reference .* undefined|Citation .* undefined|multiply defined' .build/leanSPHINCS.log .build/slides.log

  build-pdf:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            leanSPHINCS.tex
            slides.tex
      - name: Fail on an undefined reference or citation
        run: |
          ! grep -qE 'Reference .* undefined|Citation .* undefined|multiply defined' .build/leanSPHINCS.log .build/slides.log
      - name: Name the artifacts
        run: cp .build/leanSPHINCS.pdf .build/slides.pdf .
      - name: Drop the old assets (lowercase names clash case-insensitively; the leanXMSS note is gone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in leansphincs.pdf leanxmss.pdf leanXMSS.pdf; do
            gh release delete-asset doc-latest "$a" --yes --repo "$GITHUB_REPOSITORY" || true
          done
      - name: Publish the PDFs as release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: doc-latest
          name: leanSphincs candidate note
          body: |
            Auto-built on every push to `main`.

            `leanSPHINCS.pdf` is the note describing the leanSphincs candidate,
            `slides.pdf` the talk on the WOTS forest and the privacy of a pruned key.
          make_latest: false
          files: |
            leanSPHINCS.pdf
            slides.pdf
