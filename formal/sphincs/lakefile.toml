name = "sphincs-security"
version = "0.1.0"
defaultTargets = ["LeanForest", "FORS"]

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "cbd4144"

[[lean_lib]]
name = "LeanForest"
# `LeanForest.lean` imports every module; `LeanForest/Axioms.lean` checks their axioms.
roots = ["LeanForest", "LeanForest.Axioms"]
# Every module carries the `[Params]` instance (the height, the layers, the kept subtree).
leanOptions = { weak.linter.unusedSectionVars = false }

[[lean_lib]]
name = "FORS"
# The FORS variant: FORS instead of the forest. `FORS.lean` imports every module.
roots = ["FORS", "FORS.Axioms"]
leanOptions = { weak.linter.unusedSectionVars = false }
